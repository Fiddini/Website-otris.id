<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTRIS - Futuristic Hero Background</title>
<style>
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    background: #00102e; /* deep navy blue */
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }
  .hero-background {
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    overflow: hidden;
    z-index: -1;
    background: 
      radial-gradient(ellipse at center, rgba(16,42,105,0.7) 0%, rgba(0,0,15,0.95) 70%),
      linear-gradient(90deg, #004085, #00193a);
  }
  /* Glowing lines representing connections */
  .glowing-lines {
    position: absolute;
    top: 50%; left: 50%;
    width: 100vw;
    height: 60vh;
    pointer-events: none;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
  }
  .glowing-lines svg line {
    stroke: #56b4ff;
    stroke-width: 1.5;
    stroke-linecap: round;
    filter: drop-shadow(0 0 8px #6ecfff);
    animation: pulseGlow 3s infinite ease-in-out;
  }
  .glowing-lines svg circle {
    fill: #5ac8ff;
    filter: drop-shadow(0 0 12px #61bbff);
    animation: pulseGlow 3s infinite ease-in-out alternate;
  }

  @keyframes pulseGlow {
    0%, 100% { stroke-opacity: 1; fill-opacity:1; }
    50% { stroke-opacity: 0.6; fill-opacity:0.6; }
  }

  /* Digital data flow rectangles */
  .data-flow {
    position: absolute;
    top: 20%; left: 5%;
    display: flex;
    gap: 6px;
  }
  .data-flow div {
    width: 6px;
    height: 20px;
    background: linear-gradient(180deg, #a3d6ff 0%, transparent 100%);
    opacity: 0.25;
    animation: verticalFlow 1.4s linear infinite;
  }
  .data-flow div:nth-child(2) {
    height: 14px;
    animation-delay: 0.3s;
  }
  .data-flow div:nth-child(3) {
    animation-delay: 0.6s;
    height: 28px;
  }
  .data-flow div:nth-child(4) {
    height: 18px;
    animation-delay: 0.9s;
  }
  @keyframes verticalFlow {
    0% { transform: translateY(20px); opacity: 0.4;}
    50% { opacity: 1;}
    100% { transform: translateY(-15px);opacity: 0.4;}
  }

  /* Clean center placeholder */
  .center-clear {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 200px;
    height: 200px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 70%, rgba(0,0,20,0.8) 100%);
    border-radius: 50%;
  }

  /* Text overlay container - example */
  .text-overlay {
    position: relative;
    max-width: 900px;
    padding: 3rem 2rem;
    text-align: center;
    z-index: 10;
  }
  .text-overlay h1 {
    font-size: 3rem;
    font-weight: 700;
    color: #a2d2ff;
    margin-bottom: 1rem;
    text-shadow: 0 0 8px rgba(162,210,255,0.7);
  }
  .text-overlay p {
    font-size: 1.3rem;
    color: #d0e7ffcc;
    max-width: 650px;
    margin: 0 auto;
    line-height: 1.5;
    text-shadow: 0 0 6px rgba(208,231,255,0.6);
  }
</style>
</head>
<body>

<!-- Hero Background -->
<div class="hero-background"></div>

<!-- Glowing Lines (SVG) -->
<div class="glowing-lines">
  <svg width="100%" height="100%" viewBox="0 0 1000 400" preserveAspectRatio="none" >
    <line x1="100" y1="60" x2="300" y2="200" />
    <line x1="900" y1="340" x2="700" y2="200" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="450" y1="100" x2="600" y2="200" />
    <line x1="600" y1="300" x2="350" y2="250" />
    <circle cx="500" cy="200" r="12" />
    <circle cx="300" cy="200" r="8" />
    <circle cx="700" cy="200" r="8" />
  </svg>
</div>

<!-- Digital Data Flow Bars -->
<div class="data-flow">
  <div></div><div></div><div></div><div></div>
</div>

<!-- Center Clear Area -->
<div class="center-clear"></div>

<!-- Text overlay example -->
<div class="text-overlay">
  <h1>OTRIS</h1>
  <p>First Integrated Real-Time Surgical Supervision System with Full Operating Room Control</p>
</div>

</body>
</html>
