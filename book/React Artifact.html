tail:"Pertanyaannya sederhana namun menghantam: bagaimana membuat dokter daerah berani bertindak, dengan payung hukum yang jelas, dengan supervisi subspesialis di belakangnya? Jawabannya bukan rumah sakit baru, tapi jembatan digital.",tags:["Keranjang Sawit","Legal Defense","Kemanusiaan"]},{no:"04",title:"Arsitektur Jembatan: Apa itu OTRIS?",subtitle:"Integration Over Replacement",summary:"OTRIS bukan mengganti rumah sakit. Ia menempel, menguatkan, menghubungkan. Hardware sinematik Sony FX3, sensor depth Orbbec Femto Bolt, Gateway yang bekerja di listrik naik-turun. Software yang bicara HL7, MQTT, WebSocket, FHIR.",pepatah:"Bersatu teguh, bercerai runtuh — sistem yang bicara satu bahasa.",detail:"Penjelasan poetik: OTRIS seperti dalang yang tak terlihat. Ia mengambil cahaya dari lampu operasi, menerjemahkan denyut nadi dari monitor tua, dan mengantarnya — utuh, sinkron, terenkripsi — ke layar subspesialis di Jakarta. Tanpa meminta RS daerah membeli alat baru.",tags:["Sony FX3","HL7 FHIR","Arsitektur"],isTechnical:!0},{no:"05",title:"OTRIS Menyelesaikan Masalah Apa?",subtitle:"Lima Luka Kronis Sistem Rujukan",summary:"Sentralisasi subspesialis di Jawa. Jalur rujukan 300km yang memakan waktu emas. Biaya non-medis yang menjadi pajak geografis bagi keluarga miskin. RS daerah yang tak pernah tumbuh karena kasus sulit selalu dirujuk. Data yang terisolasi di server lokal.",pepatah:"Air yang tenang jangan disangka tiada buaya.",detail:"Setiap masalah adalah lingkaran setan. OTRIS memotongnya di tengah: kasus sulit tetap di daerah, dengan supervisi. Ekonomi keluarga selamat, RS daerah belajar, data mengalir ke SATUSEHAT. Kedaulatan medis bukan jargon, tapi praktik harian.",tags:["Rujukan","Pajak Geografis","Data"]},{no:"06",title:"Dokter Tidak Digantikan, Dokter Diperkuat",subtitle:"Mitos Robot dan GPS Ruang Operasi",summary:"OTRIS bukan AI yang menggantikan dokter. Ia adalah GPS untuk ruang operasi. Suara tenang di balik layar: 'J, teruskan. Saya di sini.' Membongkar mitos robot bedah dan mengembalikan marwah kolaborasi.",pepatah:"Tangan yang memberi lebih mulia dari tangan yang mengambil.",detail:"Kisah operasi pertama dengan supervisi realtime. Dokter umum di Dabo, konsultan digestif di Pekanbaru. Tangan yang gemetar menjadi mantap bukan karena teknologi, tapi karena tahu ia tidak sendiri. Ini bukan telemedicine, ini tele-presence.",tags:["Supervisi","Human in the Loop","Kolaborasi"]},{no:"07",title:"Ekonomi Baru Layanan Bedah Indonesia",subtitle:"RS Daerah jadi Profit Center",summary:"Model sharing jasa 20-25% yang adil. Ketika operasi tetap di daerah, uang berputar di daerah. Keluarga tak jual kebun, tak gadaikan motor. RS daerah yang dulu cost center, kini menjadi pusat pertumbuhan.",pepatah:"Rezeki elang tak akan dimakan harimau — rezeki daerah untuk daerah.",detail:"Matematika kedaulatan: 1 pasien rujukan = Rp 15-30 juta hilang dari ekonomi pulau. Dengan OTRIS, 70% biaya tetap di ekosistem lokal. Dokter daerah sejahtera, perawat belajar, apotek hidup. Medis adalah ekonomi.",tags:["Sharing Jasa","Ekonomi Mikro","Kedaulatan"]}];function yi(){let[e,t]=Ce.useState("01"),[n,r]=Ce.useState(!1),[l,u]=Ce.useState(!1),o=Ce.useRef(null),i=Ce.useRef(null),a=Ce.useRef(null),c=Ce.useRef(null),y=Ce.useRef(null);Ce.useEffect(()=>{let p=()=>u(window.scrollY>20);return window.addEventListener("scroll",p),()=>window.removeEventListener("scroll",p)},[]);let v=(p)=>{p.current?.scrollIntoView({behavior:"smooth",block:"start"}),r(!1)};return m("div",{className:"min-h-screen bg-[#FFFEF7] text-[#0B1D3A] selection:bg-[#D4AF37]/30",children:[s("style",{children:`
