        .sans { font-family: "Inter", system-ui, sans-serif; }
        html, body { overflow-x: hidden; max-width: 100vw; }
        /* Premium cursor — only desktop */
        @media (min-width: 1024px) {
          body.custom-cursor-active, body.custom-cursor-active * {
            cursor: none !important;
          }
        }
        .cursor-dot {
          position: fixed; top:0; left:0; width:8px; height:8px;
          background:#D4AF37; border-radius:9999px;
          box-shadow: 0 0 0 1px rgba(212,175,55,0.35), 0 0 18px rgba(212,175,55,0.9), 0 0 36px rgba(212,175,55,0.35);
          pointer-events:none; z-index:9999; will-change: transform; mix-blend-mode: normal;
          transition: transform 0.18s cubic-bezier(.16,1,.3,1);
        }
        .cursor-ring {
          position: fixed; top:0; left:0; width:44px; height:44px;
          border:1px solid rgba(212,175,55,0.55);
          background: rgba(212,175,55,0.06);
          border-radius:9999px; pointer-events:none; z-index:9998;
          will-change: transform, opacity;
          transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease, background 0.25s ease;
          box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
          backdrop-filter: blur(0.5px);
        }
        .beam-layer {
          position: fixed; inset:0; pointer-events:none; z-index:20;
          opacity:1; will-change: background; transition: opacity 0.3s ease;
          mix-blend-mode: soft-light;
        }
        /* Gold flow line — reusable */
        .gold-underline { position: relative; display:inline-block; }
        .gold-underline::after{
          content:""; position:absolute; left:0; bottom:-6px; height:2px; width:0;
          background: linear-gradient(90deg, #D4AF37 0%, rgba(212,175,55,0.6) 55%, transparent 100%);
          transition: width 0.75s cubic-bezier(.16,1,.3,1);
        }
        .gold-underline:hover::after, .group:hover .gold-underline::after { width:100%; }
        /* Card lift + gold sweep */
        .lift-card {
          position:relative; overflow:hidden;
          transition: transform 0.45s cubic-bezier(.16,1,.3,1), box-shadow 0.45s cubic-bezier(.16,1,.3,1), border-color 0.35s ease;
          will-change: transform;
        }
        .lift-card::before{
          content:""; position:absolute; top:0; left:-100%; width:100%; height:2px;
          background: linear-gradient(90deg, transparent, #D4AF37, transparent);
          transition: left 0.9s cubic-bezier(.16,1,.3,1);
          z-index:2;
        }
        .lift-card:hover { transform: translateY(-6px); box-shadow: 0 24px 48px -16px rgba(10,25,49,0.18), 0 12px 24px -10px rgba(10,25,49,0.12); }

        }

          background: #D4AF37; transition: width 0.65s cubic-bezier(.16,1,.3,1);
        }

        }
